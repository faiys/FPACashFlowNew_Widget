<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Budget Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- <link rel="stylesheet" href="static/loader.css"> -->
    <link rel="stylesheet" href="static/style.css">
    <link rel="stylesheet" href="static/loader.css">
   

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://js.zohostatic.com/creator/widgets/version/2.0/widgetsdk-min.js"></script>

  </head>
  <body>
    <!-- <div class="header-container">
        <div style="padding-left: 21px;">
            <h1 class="fw-bold"><i class="fas fa-chart-line me-3"></i>Modern Cash Flow Tracker</h1>
            <p class="lead">Track your monthly cash inflows and outflows with monthly opening and closing balances</p>
        </div>
    </div> -->

    <div>
        <!-- Cash Flow Table -->
        <div class="card">
            <div class="card-header d-flex align-items-center justify-content-between">
                <!-- Left side -->
                <div class="d-flex align-items-center gap-3">
                    <span>
                        <i class="fas fa-money-bill-wave me-2"></i>
                        Cash Flow Details
                    </span>

                    <span class="text-muted fs-6">
                        <i class="bi bi-funnel me-1"></i>
                        <span id="filterPreview" class="active-filters">
                            No active filters
                        </span>
                    </span>
                </div>

                <!-- Right side -->
                <button class="search-icon-btn" id="openSearchBtn">
                    <i class="bi bi-search"></i>
                </button>
            </div>
            <div class="card-body p-0">
                <div class="table-container">
                    <table class="cashflow-table" id="cashflowTable">
                        <thead>
                            
                        </thead>
                        <tbody id="cashflowBody">
                            <!-- Data will be populated by JavaScript -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
        <!-- overlay (hidden by default) -->
        <div class="search-modal-overlay" id="modalOverlay"></div>
        <!-- right side modal (navigation modal) -->
        <div class="search-modal" id="searchModal">
            <div class="modal-header">
                <h3><i class="bi bi-sliders2 me-2" style="font-size: 1.3rem;"></i>Search</h3>
                <button class="btn-close" id="closeModalBtn"><i class="bi bi-x-lg"></i></button>
            </div>
            <div class="modal-body">
                <!-- Year Lookup field -->
                <div class="form-group mb-4">
                    <div class="filter-label"><i class="bi bi-calendar3 me-1"></i> Year</div>
                    <div class="lookup-container">
                        <input type="text" id="search-yearInput" placeholder="Search or select year..." autocomplete="off">
                        <div id="search-yearlist" class="lookup-list"></div>
                    </div>
                </div>

                <!-- Month range (from / to) -->
                <div class="form-group mb-3">
                    <div class="filter-label"><i class="bi bi-calendar-range me-1"></i> Month Range</div>
                    <div class="month-range-row">
                        <select class="form-control" id="monthFrom">
                            <option value="" selected>From month</option>
                            <option value="January">January</option>
                            <option value="February">February</option>
                            <option value="March">March</option>
                            <option value="April">April</option>
                            <option value="May">May</option>
                            <option value="June">June</option>
                            <option value="July">July</option>
                            <option value="August">August</option>
                            <option value="September">September</option>
                            <option value="October">October</option>
                            <option value="November">November</option>
                            <option value="December">December</option>
                        </select>
                        <span class="month-separator">—</span>
                        <select class="form-control" id="monthTo">
                            <option value="" selected>To month</option>
                            <option value="January">January</option>
                            <option value="February">February</option>
                            <option value="March">March</option>
                            <option value="April">April</option>
                            <option value="May">May</option>
                            <option value="June">June</option>
                            <option value="July">July</option>
                            <option value="August">August</option>
                            <option value="September">September</option>
                            <option value="October">October</option>
                            <option value="November">November</option>
                            <option value="December">December</option>
                        </select>
                    </div>
                </div>

                <div class="form-group mb-4">
                    <div class="filter-label"><i class="bi bi-person-vcard me-1"></i> Account Name</div>
                    <div class="lookup-container">
                        <input type="text" id="search-accountInput" placeholder="Search or select account name..." autocomplete="off">
                        <div id="search-accountlist" class="lookup-list"></div>
                    </div>
                </div>

                <!-- action buttons -->
                <div class="filter-actions">
                    <button class="btn btn-primary-custom flex-fill" id="applyFilterBtn"><i class="bi bi-check-lg me-2"></i>Apply</button>
                    <button class="btn btn-outline-custom flex-fill" id="resetFilterBtn"><i class="bi bi-arrow-counterclockwise me-2"></i>Reset</button>
                </div>
            </div>
        </div>
        <!-- loader -->
        <div id="loader-overlay" class="loader-overlay" style="display: none;">
            <div id="loader" class="loader-container">
                <div class="fpa-loader">
                    <div class="letter letter-f">F</div>
                    <div class="letter letter-p">P</div>
                    <div class="letter letter-a">A</div>
                </div>
                <div class="loading-text">Loading...</div>
            </div>
        </div>
        <!-- loader -->
    </div>
  </body>
  <script src="static/loader.js"></script>
  <script src="static/search.js"></script>
  <script src="static/renderTable.js"></script>
  <script src="static/zoho.js"></script>
</html>
